# ZTI Tier-3 required check — the merge-time receipt-gate.
#
# Copy this file into .github/workflows/ of the GOVERNED repo, then mark the
# "zti-verify" job as a required status check in branch protection — that is
# what turns a local `git commit --no-verify` bypass into a failed merge.
# Full wiring steps: docs/ENFORCEMENT-TIERS.md in the ZTI Core delivery.
#
# Repo secrets:
#   ZTI_PLANE_URL   URL of your ZTI Core plane, reachable from CI runners
#   ZTI_GATE_ID     a gate id registered on that plane
#   ZTI_GATE_KEY    that gate's bearer key (used verify-only in CI; receipts
#                   are minted on the developer's machine, never here)
#
# The zti CLI is open source (https://github.com/bitscon/zti-cli) and published
# on PyPI as `zti-cli`. It is installed here from PyPI, pinned to an exact
# version AND artifact hash — NEVER from a file inside the repo it checks, and
# never from an unpinned git ref. That is deliberate: a governed PR must not be
# able to vendor a stub "zti" wheel that passes its own gate, and an unpinned
# ref would let the verifier change under you. Pins below are the published
# 0.2.0 release; regenerate on a version bump:
#   pip download --no-deps zti-cli==<v> ztip==<v> && sha256sum *.whl
#
#   Residual: a PR that also edits THIS workflow file could repoint the
#   install. Close that GitHub-side by marking zti-verify a required workflow
#   / branch-protection ruleset — repo owner config, not settable from the repo.
#
# Fail-closed by design: no receipt, a non-passing receipt, an unreachable
# plane, an unreachable index, and a license-locked plane all exit nonzero and
# fail this check.

name: zti-verify
on:
  pull_request:

jobs:
  zti-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify the PR HEAD — the exact tree the developer's machine minted
          # a receipt for — never the ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the zti verifier — pinned, from PyPI, OUTSIDE the tree under test
        run: |
          printf '%s\n' \
            'zti-cli==0.2.0 --hash=sha256:3ea9c2b606e67f24218047930d757f69c04b5d6854a6fe2523867c3f5f4e0ac3' \
            'ztip==1.0.0.dev2 --hash=sha256:4767a57369ff66289056336f51959a9e9997d0db3b646326d3491bcf8ecb1ac9' \
            > "$RUNNER_TEMP/zti-verifier.lock"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/zti-verifier.lock"

      - name: Verify a passing receipt exists for exactly this content
        env:
          ZTI_PLANE_URL: ${{ secrets.ZTI_PLANE_URL }}
          ZTI_GATE_ID: ${{ secrets.ZTI_GATE_ID }}
          ZTI_GATE_KEY: ${{ secrets.ZTI_GATE_KEY }}
        run: zti verify ${{ github.event.pull_request.head.sha }}
